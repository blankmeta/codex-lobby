name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-and-storage:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
  macos-integration:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: brew install xray
      - run: npm install --prefix "$RUNNER_TEMP/codex-switch-auth" --ignore-scripts --no-audit --no-fund @loongphy/codex-auth@0.3.0
      - run: |
          export CODEX_SWITCH_TEST_AUTH_BINARY="$RUNNER_TEMP/codex-switch-auth/node_modules/.bin/codex-auth"
          python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
          CODEX_SWITCH_NETWORK_TESTS: '1'
