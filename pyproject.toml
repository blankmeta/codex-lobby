[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-switch"
version = "1.1.0"
description = "Switch ChatGPT accounts for Codex, with optional VLESS connectivity"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codex-switch = "codex_switch.__main__:main"
codex-vpn = "codex_switch.__main__:main"
codex-proxy = "codex_switch.compat:main"

[tool.setuptools.packages.find]
where = ["src"]
