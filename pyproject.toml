[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runlobby"
version = "1.4.0"
description = "Codex and Claude accounts, usage limits and sessions in one terminal menu"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = ["psutil>=7,<8"]

[project.scripts]
runlobby = "codex_switch.__main__:main"
rlb = "codex_switch.__main__:main"
codex-lobby = "codex_switch.__main__:main"
cxl = "codex_switch.__main__:main"
codex-switch = "codex_switch.__main__:main"
codex-vpn = "codex_switch.__main__:main"
codex-proxy = "codex_switch.compat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_switch = ["infrastructure/tool-manifest.json"]
