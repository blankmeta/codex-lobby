[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-switch"
version = "1.2.0"
description = "Isolated Codex account profiles, project preferences, and optional VLESS connectivity"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []

[project.scripts]
codex-switch = "codex_switch.__main__:main"
codex-vpn = "codex_switch.__main__:main"
codex-proxy = "codex_switch.compat:main"

[tool.setuptools.packages.find]
where = ["src"]
